<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RE:WEAR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключаем клиент Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d0d0d; color: #ffffff; padding: 16px; padding-bottom: 80px; }
    .header { text-align: center; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;}
    .logo { font-size: 24px; font-weight: 800; letter-spacing: 2px; }
    .logo span { color: #8c8c8c; }
    .slogan { font-size: 10px; color: #8c8c8c; letter-spacing: 1px; }
    .banner { background: #1a1a1a; border-radius: 16px; padding: 20px; margin-bottom: 24px; border: 1px solid #2a2a2a; text-align: left;}
    .banner h2 { font-size: 20px; margin-bottom: 8px; font-weight: 700; }
    .banner p { font-size: 13px; color: #a0a0a0; margin-bottom: 16px; }
    .btn-main { background: #ffffff; color: #000000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block;}
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .card { background: #161616; border-radius: 12px; overflow: hidden; border: 1px solid #222222; text-decoration: none; color: inherit; display: block;}
    .card-img { width: 100%; height: 160px; object-fit: cover; background: #222; display: block; }
    .card-info { padding: 10px; }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-price { font-size: 14px; font-weight: 700; }
    .card-meta { font-size: 11px; color: #8c8c8c; margin-top: 4px; }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0d0d0d; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 12px 0; z-index: 10;}
    .nav-item { color: #8c8c8c; font-size: 11px; text-decoration: none; text-align: center; cursor: pointer;}
    .nav-item.active { color: #ffffff; font-weight: 600; }
    #loading { text-align: center; color: #8c8c8c; padding: 20px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo"><span>RE:</span>WEAR</div>
    <div class="slogan">ВИНТАЖ / Б/У / ОРИГИНАЛ</div>
  </div>

  <div class="banner">
    <h2>Вещи, которые имеют историю.</h2>
    <p>Лучшие вещи не стареют. Они просто ждут своего человека.</p>
    <a href="#" class="btn-main">Перейти к каталогу &rarr;</a>
  </div>

  <div class="section-title">Популярные товары</div>

  <div id="loading">Загрузка товаров...</div>
  <div class="grid" id="catalog-grid" style="display: none;"></div>

  <div class="nav-bar">
    <div class="nav-item active">Главная</div>
    <div class="nav-item">Каталог</div>
    <div class="nav-item">Избранное</div>
    <div class="nav-item">Профиль</div>
  </div>

  <script>
    // Инициализация Telegram Mini App
    const tg = window.Telegram.WebApp;
    tg.expand();

    // -------------------------------------------------------------
    // ВСТАВЬ СВОИ КЛЮЧИ ИЗ SUPABASE НИЖЕ ВМЕСТО ТЕКСТА В КАВЫЧКАХ:
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://lseatoyffptmjljinswp.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZWF0b3lmZnB0bWpsamluc3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDA2MTEsImV4cCI6MjEwNjI3NjYxMX0.Cv10pBFfb8VwlLgVI-jVrjZ1Bregum2NozVKYwxs6tM';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Функция загрузки товаров из базы данных
    async function loadProducts() {
      const loadingEl = document.getElementById('loading');
      const gridEl = document.getElementById('catalog-grid');

      try {
        const { data: products, error } = await _supabase
          .from('products')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        if (!products || products.length === 0) {
          loadingEl.innerText = 'В каталоге пока нет товаров. Добавьте первый товар в Supabase!';
          return;
        }

        gridEl.innerHTML = '';
        loadingEl.style.display = 'none';
        gridEl.style.display = 'grid';

        products.forEach(product => {
          // Получаем картинку или показываем заглушку
          let imageUrl = 'https://images.unsplash.com/photo-1544441893-675973e31985?w=500';
          if (product.image_urls) {
            imageUrl = Array.isArray(product.image_urls) ? product.image_urls[0] : product.image_urls;
          }

          const priceFormatted = Number(product.price || 0).toLocaleString('ru-RU');

          const cardHtml = `
            <a href="#" class="card" onclick="openProduct('${product.title}', '${priceFormatted}')">
              <img class="card-img" src="${imageUrl}" alt="${product.title}">
              <div class="card-info">
                <div class="card-title">${product.title || 'Без названия'}</div>
                <div class="card-price">${priceFormatted} сум</div>
                <div class="card-meta">${product.category || 'Ветровки'} • ${product.condition || '8/10'}</div>
              </div>
            </a>
          `;
          gridEl.innerHTML += cardHtml;
        });

      } catch (err) {
        console.error('Ошибка Supabase:', err);
        loadingEl.innerText = 'Ошибка подключения к базе. Проверьте ключи в файле index.html.';
      }
    }

    function openProduct(title, price) {
      tg.showAlert(`Товар: ${title}\nЦена: ${price} сум`);
    }

    loadProducts();
  </script>
</body>
</html>
