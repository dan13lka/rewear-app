<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RE:WEAR Catalog</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f7f7f7;
      --card-bg: #ffffff;
      --text-color: #111111;
      --text-muted: #777777;
      --accent-color: #000000;
      --accent-red: #ff4d4d;
      --border-color: #eeeeee;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 70px;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--card-bg);
      z-index: 100;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-bar {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #f0f0f0;
      font-size: 14px;
      outline: none;
    }

    .filter-toggle-btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #f0f0f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .filter-toggle-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    .filter-toggle-btn.active svg {
      stroke: #fff;
    }

    .filter-panel {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      flex-direction: column;
      gap: 12px;
    }

    .filter-panel.open {
      display: flex;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .filter-select, .filter-input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      background: var(--card-bg);
    }

    .price-range {
      display: flex;
      gap: 8px;
    }

    .price-range input {
      width: 50%;
    }

    .filter-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-reset {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: transparent;
      font-size: 13px;
      cursor: pointer;
    }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px 4px 16px;
      scrollbar-width: none;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .cat-chip.active {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .card-img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      background: #e0e0e0;
    }

    .card-fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .card-fav-btn svg {
      width: 18px;
      height: 18px;
    }

    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-shop {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-price {
      font-size: 14px;
      font-weight: 700;
      margin-top: auto;
    }

    .card-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      backdrop-filter: blur(3px);
    }

    .modal-content {
      position: absolute;
      bottom: 0;
      width: 100%;
      max-height: 90vh;
      background: var(--card-bg);
      border-radius: 20px 20px 0 0;
      overflow-y: auto;
      padding: 20px;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-img {
      width: 100%;
      border-radius: 12px;
      aspect-ratio: 3/4;
      object-fit: cover;
      margin-bottom: 16px;
    }

    .modal-shop {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin: 4px 0 8px 0;
    }

    .modal-price {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    .modal-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .modal-tag {
      background: #f0f0f0;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }

    .modal-desc {
      font-size: 14px;
      color: #444;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-primary {
      flex: 1;
      background: var(--accent-color);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-secondary {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
    }

    .nav-item.active {
      color: var(--accent-color);
      font-weight: 600;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      margin-bottom: 2px;
    }

    .badge {
      position: absolute;
      top: -2px;
      right: 12px;
      background: var(--accent-red);
      color: white;
      font-size: 10px;
      border-radius: 10px;
      padding: 2px 6px;
      font-weight: bold;
    }

    /* Tab content */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cart tab */
    .cart-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      background: var(--card-bg);
      padding: 10px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      align-items: center;
    }

    .cart-item-img {
      width: 60px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .cart-item-price {
      font-size: 14px;
      font-weight: 700;
    }

    .cart-item-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      padding: 8px;
      cursor: pointer;
    }

    .cart-checkout-bar {
      position: fixed;
      bottom: 60px;
      left: 0;
      width: 100%;
      background: var(--card-bg);
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- HEADER / SEARCH / FILTERS -->
  <header>
    <div class="search-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Поиск вещей или брендов..." oninput="applyFilters()">
      <button class="filter-toggle-btn" id="filter-btn" onclick="toggleFilterPanel()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
      </button>
    </div>

    <div class="filter-panel" id="filter-panel">
      <div class="filter-group">
        <label class="filter-label">Магазин</label>
        <select id="filter-shop" class="filter-select" onchange="applyFilters()">
          <option value="all">Все магазины</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Цена (сум)</label>
        <div class="price-range">
          <input type="number" id="filter-price-min" class="filter-input" placeholder="От" oninput="applyFilters()">
          <input type="number" id="filter-price-max" class="filter-input" placeholder="До" oninput="applyFilters()">
        </div>
      </div>

      <div class="filter-group">
        <label class="filter-label">Сортировка</label>
        <select id="filter-sort" class="filter-select" onchange="applyFilters()">
          <option value="default">По умолчанию</option>
          <option value="price-asc">Сначала дешевле</option>
          <option value="price-desc">Сначала дороже</option>
        </select>
      </div>

      <div class="filter-actions">
        <button class="btn-reset" onclick="resetFilters()">Сбросить фильтры</button>
      </div>
    </div>
  </header>

  <!-- CATEGORIES -->
  <div class="categories-scroll">
    <div class="cat-chip active" onclick="filterCategory('все', this)">Все</div>
    <div class="cat-chip" onclick="filterCategory('худи', this)">Худи</div>
    <div class="cat-chip" onclick="filterCategory('футболки', this)">Футболки</div>
    <div class="cat-chip" onclick="filterCategory('штаны', this)">Штаны</div>
    <div class="cat-chip" onclick="filterCategory('куртки', this)">Куртки</div>
    <div class="cat-chip" onclick="filterCategory('аксессуары', this)">Аксессуары</div>
  </div>

  <!-- MAIN TAB: CATALOG -->
  <div id="tab-home" class="tab-content active">
    <div id="loading" class="empty-state">Загрузка каталога...</div>
    <div class="grid" id="catalog-grid"></div>
  </div>

  <!-- TAB: FAVORITES -->
  <div id="tab-favorites" class="tab-content">
    <div class="empty-state" id="fav-empty" style="display: none;">У вас пока нет избранных товаров</div>
    <div class="grid" id="favorites-grid"></div>
  </div>

  <!-- TAB: CART -->
  <div id="tab-cart" class="tab-content">
    <div class="empty-state" id="cart-empty" style="display: none;">Ваша корзина пуста</div>
    <div class="cart-list" id="cart-list"></div>
    <div class="cart-checkout-bar" id="cart-checkout-bar" style="display: none;">
      <div>
        <div style="font-size: 12px; color: var(--text-muted);">Итого (<span id="cart-total-count">0</span>):</div>
        <div style="font-size: 16px; font-weight: 800;" id="cart-total-sum">0 сум</div>
      </div>
      <button class="btn-primary" style="flex: initial; padding: 10px 20px;" onclick="checkoutCart()">Оформить</button>
    </div>
  </div>

  <!-- MODAL: PRODUCT DETAILS -->
  <div class="modal" id="product-modal">
    <div class="modal-content">
      <img id="m-img" class="modal-img" src="" alt="">
      <div id="m-shop" class="modal-shop"></div>
      <div id="m-title" class="modal-title"></div>
      <div id="m-price" class="modal-price"></div>
      
      <div class="modal-tags">
        <span id="m-category" class="modal-tag"></span>
        <span id="m-size" class="modal-tag"></span>
      </div>

      <div id="m-desc" class="modal-desc"></div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="toggleFavFromModal()">
          <svg id="m-fav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>
        <button class="btn-secondary" id="m-cart-btn" onclick="toggleCartFromModal()">В корзину</button>
        <a id="m-buy-btn" href="#" class="btn-primary" target="_blank">Купить сейчас</a>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      Каталог
    </div>
    <div class="nav-item" onclick="switchTab('favorites', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      Избранное
    </div>
    <div class="nav-item" onclick="switchTab('cart', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      Корзина
      <span class="badge" id="cart-count">0</span>
    </div>
  </nav>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const ADMIN_USERNAME = 'rewear_admin'; // Укажите юзернейм администратора Telegram
    const API_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec'; // Замените на ваш URL Google Apps Script

    let loadedProducts = [];
    let favorites = JSON.parse(localStorage.getItem('rewear_favs') || '[]');
    let cart = JSON.parse(localStorage.getItem('rewear_cart') || '[]');
    let selectedCategory = 'все';
    let activeModalIndex = null;

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (tg && tg.BackButton) {
        tg.BackButton.onClick(closeProduct);
      }
      initAndLoad();
    });

    function saveState() {
      localStorage.setItem('rewear_favs', JSON.stringify(favorites));
      localStorage.setItem('rewear_cart', JSON.stringify(cart));
      updateCartBadge();
    }

    async function initAndLoad() {
      updateCartBadge();
      
      // Попытка загрузить данные из API (или тестовые данные при ошибке)
      try {
        const response = await fetch(API_URL);
        if (response.ok) {
          const data = await response.json();
          loadedProducts = Array.isArray(data) ? data : (data.products || []);
        } else {
          throw new Error('API request failed');
        }
      } catch (err) {
        console.warn('Используем тестовые данные (ошибка загрузки с сервера):', err);
        loadedProducts = [
          { id: '1', title: 'Худи Oversize Black', price: 350000, category: 'Худи', size: 'L', shop: 'RE:WEAR Select', description: 'Плотный хлопок, стиль оверсайз.', image_urls: ['https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500'] },
          { id: '2', title: 'Футболка Vintage White', price: 180000, category: 'Футболки', size: 'M', shop: 'Vintage Store', description: 'Ретро принт, 100% хлопок.', image_urls: ['https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500'] },
          { id: '3', title: 'Джинсы Wide Leg', price: 420000, category: 'Штаны', size: 'S', shop: 'Denim Lab', description: 'Широкий крой, стильный деним.', image_urls: ['https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500'] }
        ];
      }

      populateShopFilter(loadedProducts);
      applyFilters();
    }

    function populateShopFilter(products) {
      const shopSelect = document.getElementById('filter-shop');
      if (!shopSelect) return;

      const shops = new Set();
      products.forEach(p => {
        if (p.shop && p.shop.trim() !== '') {
          shops.add(p.shop.trim());
        }
      });

      shopSelect.innerHTML = '<option value="all">Все магазины</option>';
      shops.forEach(shopName => {
        const opt = document.createElement('option');
        opt.value = shopName;
        opt.innerText = shopName;
        shopSelect.appendChild(opt);
      });
    }

    function toggleFilterPanel() {
      const panel = document.getElementById('filter-panel');
      const btn = document.getElementById('filter-btn');
      if (panel) panel.classList.toggle('open');
      if (btn) btn.classList.toggle('active');
    }

    function applyFilters() {
      const searchInput = document.getElementById('search-input');
      const shopSelect = document.getElementById('filter-shop');
      const minPriceInput = document.getElementById('filter-price-min');
      const maxPriceInput = document.getElementById('filter-price-max');
      const sortSelect = document.getElementById('filter-sort');

      const searchQuery = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const selectedShop = shopSelect ? shopSelect.value : 'all';
      const minPrice = parseFloat(minPriceInput ? minPriceInput.value : 0) || 0;
      const maxPrice = parseFloat(maxPriceInput ? maxPriceInput.value : Infinity) || Infinity;
      const sortType = sortSelect ? sortSelect.value : 'default';

      let filtered = loadedProducts.filter(product => {
        const titleMatch = (product.title || '').toLowerCase().includes(searchQuery);
        const descMatch = (product.description || '').toLowerCase().includes(searchQuery);
        const shopTextMatch = (product.shop || '').toLowerCase().includes(searchQuery);
        const searchMatches = titleMatch || descMatch || shopTextMatch;

        const catLower = (typeof selectedCategory !== 'undefined' ? selectedCategory : 'все').toLowerCase();
        const categoryMatches = (catLower === 'все') || (product.category && product.category.toLowerCase().includes(catLower));

        const shopMatches = (selectedShop === 'all') || (product.shop === selectedShop);

        const price = Number(product.price || 0);
        const priceMatches = price >= minPrice && price <= maxPrice;

        return searchMatches && categoryMatches && shopMatches && priceMatches;
      });

      if (sortType === 'price-asc') {
        filtered.sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
      } else if (sortType === 'price-desc') {
        filtered.sort((a, b) => Number(b.price || 0) - Number(a.price || 0));
      }

      renderProducts(filtered);
    }

    function resetFilters() {
      if (document.getElementById('search-input')) document.getElementById('search-input').value = '';
      if (document.getElementById('filter-shop')) document.getElementById('filter-shop').value = 'all';
      if (document.getElementById('filter-sort')) document.getElementById('filter-sort').value = 'default';
      if (document.getElementById('filter-price-min')) document.getElementById('filter-price-min').value = '';
      if (document.getElementById('filter-price-max')) document.getElementById('filter-price-max').value = '';
      
      selectedCategory = 'все';

      document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
      const firstChip = document.querySelector('.cat-chip');
      if (firstChip) firstChip.classList.add('active');

      applyFilters();
    }

    function filterCategory(category, element) {
      document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
      if (element) element.classList.add('active');
      selectedCategory = category;
      applyFilters();
    }

    function renderProducts(products) {
      const loadingEl = document.getElementById('loading');
      const gridEl = document.getElementById('catalog-grid');

      if (!gridEl) return;

      if (!products || products.length === 0) {
        if (loadingEl) {
          loadingEl.style.display = 'block';
          loadingEl.innerText = "Товары по вашему запросу не найдены.";
        }
        gridEl.style.display = 'none';
        gridEl.innerHTML = '';
        return;
      }

      if (loadingEl) loadingEl.style.display = 'none';
      gridEl.style.display = 'grid';

      let htmlBuffer = '';

      products.forEach((product) => {
        const originalIndex = loadedProducts.indexOf(product);
        let imageUrl = 'https://images.unsplash.com/photo-1544441893-675973e31985?w=500';
        if (product.image_urls) {
          imageUrl = Array.isArray(product.image_urls) ? product.image_urls[0] : product.image_urls;
          imageUrl = String(imageUrl).replace(/[\{\}\"\']/g, '');
        }

        const safeId = String(product.id).replace(/'/g, "\\'");
        const isFav = favorites.includes(String(product.id));
        const priceVal = Number(product.price || 0).toLocaleString('ru-RU');
        const sizeStr = product.size ? ` • ${product.size}` : '';
        const shopName = product.shop || 'RE:WEAR Select';

        htmlBuffer += `
          <div class="card" onclick="openProduct(${originalIndex})">
            <button type="button" class="card-fav-btn" onclick="toggleFav(event, '${safeId}')">
              <svg id="fav-icon-${safeId}" viewBox="0 0 24 24" fill="${isFav ? '#ff4d4d' : 'none'}" stroke="${isFav ? '#ff4d4d' : '#8c8c8c'}" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </button>
            <img class="card-img" src="${imageUrl}" alt="${product.title || ''}">
            <div class="card-info">
              <div class="card-shop">${shopName}</div>
              <div class="card-title">${product.title || 'Без названия'}</div>
              <div class="card-price">${priceVal} сум</div>
              <div class="card-meta">${product.category || 'Без категории'}${sizeStr}</div>
            </div>
          </div>
        `;
      });

      gridEl.innerHTML = htmlBuffer;
    }

    function switchTab(tabName, element) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      const targetTab = document.getElementById('tab-' + tabName);
      if (targetTab) targetTab.classList.add('active');

      if (element) {
        element.classList.add('active');
      } else {
        const items = document.querySelectorAll('.nav-item');
        if (tabName === 'home' && items[0]) items[0].classList.add('active');
        if (tabName === 'favorites' && items[1]) items[1].classList.add('active');
        if (tabName === 'cart' && items[2]) items[2].classList.add('active');
      }

      if (tabName === 'favorites') renderFavorites();
      if (tabName === 'cart') renderCart();
    }

    function toggleFav(e, id) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }

      const strId = String(id);

      if (favorites.includes(strId)) {
        favorites = favorites.filter(item => item !== strId);
      } else {
        favorites.push(strId);
      }

      saveState();

      const svgIcon = document.getElementById('fav-icon-' + strId);
      if (svgIcon) {
        const isFav = favorites.includes(strId);
        svgIcon.setAttribute('fill', isFav ? '#ff4d4d' : 'none');
        svgIcon.setAttribute('stroke', isFav ? '#ff4d4d' : '#8c8c8c');
      }

      const favTab = document.getElementById('tab-favorites');
      if (favTab && favTab.classList.contains('active')) {
        renderFavorites();
      }
    }

    function toggleFavFromModal() {
      if (activeModalIndex === null) return;
      const p = loadedProducts[activeModalIndex];
      if (!p) return;
      toggleFav(null, p.id);
      updateModalFavIcon(p.id);
    }

    function updateModalFavIcon(id) {
      const isFav = favorites.includes(String(id));
      const mFavIcon = document.getElementById('m-fav-icon');
      if (mFavIcon) {
        mFavIcon.setAttribute('fill', isFav ? '#ff4d4d' : 'none');
        mFavIcon.setAttribute('stroke', isFav ? '#ff4d4d' : '#8c8c8c');
      }
    }

    function renderFavorites() {
      const grid = document.getElementById('favorites-grid');
      const empty = document.getElementById('fav-empty');
      if (!grid) return;

      const favProducts = loadedProducts.filter(p => favorites.includes(String(p.id)));

      if (favProducts.length === 0) {
        grid.innerHTML = '';
        if (empty) empty.style.display = 'block';
        return;
      }

      if (empty) empty.style.display = 'none';

      let htmlBuffer = '';
      favProducts.forEach(product => {
        const originalIndex = loadedProducts.indexOf(product);
        let imageUrl = product.image_urls ? (Array.isArray(product.image_urls) ? product.image_urls[0] : product.image_urls) : '';
        imageUrl = String(imageUrl).replace(/[\{\}\"\']/g, '');

        const safeId = String(product.id).replace(/'/g, "\\'");

        htmlBuffer += `
          <div class="card" onclick="openProduct(${originalIndex})">
            <button type="button" class="card-fav-btn" onclick="toggleFav(event, '${safeId}')">
              <svg id="fav-icon-${safeId}" viewBox="0 0 24 24" fill="#ff4d4d" stroke="#ff4d4d" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </button>
            <img class="card-img" src="${imageUrl}">
            <div class="card-info">
              <div class="card-shop">${product.shop || 'RE:WEAR Select'}</div>
              <div class="card-title">${product.title || 'Без названия'}</div>
              <div class="card-price">${Number(product.price || 0).toLocaleString('ru-RU')} сум</div>
            </div>
          </div>
        `;
      });

      grid.innerHTML = htmlBuffer;
    }

    function toggleCartFromModal() {
      if (activeModalIndex === null) return;
      const p = loadedProducts[activeModalIndex];
      if (!p) return;
      
      const strId = String(p.id);

      if (cart.includes(strId)) {
        cart = cart.filter(id => id !== strId);
      } else {
        cart.push(strId);
      }
      
      saveState();
      closeProduct();
    }

    function removeFromCart(id) {
      const strId = String(id);
      cart = cart.filter(itemId => itemId !== strId);
      saveState();
      renderCart();
    }

    function updateCartBadge() {
      const cartCountEl = document.getElementById('cart-count');
      if (cartCountEl) {
        cartCountEl.innerText = cart.length;
      }
    }

    function renderCart() {
      const listEl = document.getElementById('cart-list');
      const emptyEl = document.getElementById('cart-empty');
      const checkoutBar = document.getElementById('cart-checkout-bar');
      if (!listEl) return;

      const cartProducts = loadedProducts.filter(p => cart.includes(String(p.id)));

      if (cartProducts.length === 0) {
        listEl.innerHTML = '';
        if (emptyEl) emptyEl.style.display = 'block';
        if (checkoutBar) checkoutBar.style.display = 'none';
        return;
      }

      if (emptyEl) emptyEl.style.display = 'none';
      if (checkoutBar) checkoutBar.style.display = 'flex';

      let totalSum = 0;
      let htmlBuffer = '';

      cartProducts.forEach(product => {
        totalSum += Number(product.price || 0);
        let imageUrl = product.image_urls ? (Array.isArray(product.image_urls) ? product.image_urls[0] : product.image_urls) : '';
        imageUrl = String(imageUrl).replace(/[\{\}\"\']/g, '');

        const safeId = String(product.id).replace(/'/g, "\\'");

        htmlBuffer += `
          <div class="cart-item">
            <img class="cart-item-img" src="${imageUrl}" alt="${product.title || ''}">
            <div class="cart-item-info">
              <div class="cart-item-title">${product.title || 'Без названия'}</div>
              <div class="cart-item-price">${Number(product.price || 0).toLocaleString('ru-RU')} сум</div>
            </div>
            <button class="cart-item-remove" onclick="removeFromCart('${safeId}')">✕</button>
          </div>
        `;
      });

      listEl.innerHTML = htmlBuffer;

      const totalCountEl = document.getElementById('cart-total-count');
      const totalSumEl = document.getElementById('cart-total-sum');

      if (totalCountEl) totalCountEl.innerText = cartProducts.length;
      if (totalSumEl) totalSumEl.innerText = totalSum.toLocaleString('ru-RU') + ' сум';
    }

    function checkoutCart() {
      const cartProducts = loadedProducts.filter(p => cart.includes(String(p.id)));
      if (cartProducts.length === 0) return;

      let message = 'Здравствуйте! Я хочу купить следующие товары из RE:WEAR:\n\n';
      
      let total = 0;
      cartProducts.forEach((p, idx) => {
        const shopInfo = p.shop ? ` [Шоп: ${p.shop}]` : '';
        message += `${idx + 1}. ${p.title} (Размер: ${p.size || 'не указан'})${shopInfo} — ${Number(p.price || 0).toLocaleString('ru-RU')} сум\n`;
        total += Number(p.price || 0);
      });

      message += `\nИтого: ${total.toLocaleString('ru-RU')} сум`;
      
      const targetUrl = `https://t.me/${ADMIN_USERNAME}?text=${encodeURIComponent(message)}`;
      
      if (window.tg && window.tg.openTelegramLink) {
        window.tg.openTelegramLink(targetUrl);
      } else {
        window.open(targetUrl, '_blank');
      }
    }

    function openProduct(index) {
      activeModalIndex = index;
      const p = loadedProducts[index];
      if (!p) return;

      let imageUrl = p.image_urls ? (Array.isArray(p.image_urls) ? p.image_urls[0] : p.image_urls) : '';
      imageUrl = String(imageUrl).replace(/[\{\}\"\']/g, '');

      document.getElementById('m-img').src = imageUrl;
      document.getElementById('m-shop').innerText = p.shop || 'RE:WEAR Select';
      document.getElementById('m-title').innerText = p.title || 'Без названия';
      document.getElementById('m-price').innerText = Number(p.price || 0).toLocaleString('ru-RU') + ' сум';
      
      document.getElementById('m-category').innerText = 'Категория: ' + (p.category || '—');
      document.getElementById('m-size').innerText = 'Размер: ' + (p.size || 'M');
      
      document.getElementById('m-desc').innerText = p.description || 'Описание отсутствует.';
      
      const shopMention = p.shop ? ` [Шоп: ${p.shop}]` : '';
      const directMsg = encodeURIComponent(`Здравствуйте! Меня интересует: ${p.title}${shopMention} (${Number(p.price || 0).toLocaleString('ru-RU')} сум)`);
      
      document.getElementById('m-buy-btn').href = `https://t.me/${ADMIN_USERNAME}?text=${directMsg}`;
      
      const cartBtn = document.getElementById('m-cart-btn');
      if (cartBtn) {
        cartBtn.innerText = cart.includes(String(p.id)) ? '✓ В корзине' : 'В корзину';
      }

      updateModalFavIcon(p.id);

      const modal = document.getElementById('product-modal');
      if (modal) modal.style.display = 'block';

      if (tg && tg.BackButton) {
        tg.BackButton.show();
      }
    }

    function closeProduct() {
      const modal = document.getElementById('product-modal');
      if (modal) modal.style.display = 'none';

      if (tg && tg.BackButton) {
        tg.BackButton.hide();
      }
      activeModalIndex = null;
    }
  </script>
</body>
</html>
