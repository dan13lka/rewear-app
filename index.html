<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RE:WEAR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d0d0d !important; color: #ffffff !important; padding: 16px; padding-bottom: 90px; }
    
    /* ШАПКА */
    .header { text-align: center; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: 800; letter-spacing: 2px; }
    .logo span { color: #8c8c8c; }
    .cart-btn { position: relative; background: #161616; border: 1px solid #262626; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .cart-badge { position: absolute; top: -4px; right: -4px; background: #ffffff; color: #0d0d0d; font-size: 10px; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #ffffff; }
    
    /* ПОИСК И КНОПКА ФИЛЬТРА */
    .search-filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-input-wrapper { position: relative; flex: 1; }
    .search-input { width: 100%; background: #161616; border: 1px solid #262626; border-radius: 12px; padding: 10px 14px 10px 38px; color: #ffffff; font-size: 13px; outline: none; }
    .search-input::placeholder { color: #666; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: #666; }
    
    .filter-trigger-btn { background: #161616; border: 1px solid #262626; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; justify-content: center; gap: 6px; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer; }
    .filter-trigger-btn.active { border-color: #ffffff; background: #222; }

    /* ПАНЕЛЬ ФИЛЬТРОВ И СОРТИРОВКИ */
    .filter-panel { display: none; background: #141414; border: 1px solid #262626; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .filter-panel.open { display: block; }
    .filter-group { margin-bottom: 14px; }
    .filter-label { font-size: 12px; font-weight: 600; color: #8c8c8c; margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-select { width: 100%; background: #1c1c1c; border: 1px solid #333; border-radius: 10px; padding: 10px; color: #fff; font-size: 13px; outline: none; }
    .price-range { display: flex; gap: 8px; }
    .price-input { flex: 1; background: #1c1c1c; border: 1px solid #333; border-radius: 10px; padding: 10px; color: #fff; font-size: 13px; outline: none; }
    .filter-actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn-apply-filter { flex: 2; background: #ffffff; color: #0d0d0d; border: none; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .btn-reset-filter { flex: 1; background: #222; color: #8c8c8c; border: 1px solid #333; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; }

    /* КАТЕГОРИИ (ЧИПЫ) */
    .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-chip { background: #161616; color: #8c8c8c; border: 1px solid #262626; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
    .cat-chip.active { background: #ffffff; color: #0d0d0d; border-color: #ffffff; }

    /* СЕТКА ТОВАРОВ */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .card { background: #161616; border-radius: 12px; overflow: hidden; border: 1px solid #222222; position: relative; cursor: pointer; }
    .card-img { width: 100%; height: 160px; object-fit: cover; background: #222; display: block; }
    .card-info { padding: 10px; }
    .card-shop { font-size: 10px; font-weight: 700; color: #8c8c8c; text-transform: uppercase; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ffffff; }
    .card-price { font-size: 14px; font-weight: 700; color: #ffffff; }
    .card-meta { font-size: 11px; color: #8c8c8c; margin-top: 4px; }
    
    /* ИКОНКА ИЗБРАННОГО НА КАРТОЧКЕ */
    .card-fav-btn { 
      position: absolute; 
      top: 8px; 
      right: 8px; 
      background: transparent !important; 
      border: none !important; 
      outline: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      width: 28px !important; 
      height: 28px !important; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      z-index: 10;
      transition: transform 0.15s ease;
    }
    .card-fav-btn:active { transform: scale(0.85); }
    .card-fav-btn svg { 
      pointer-events: none; 
      width: 20px !important; 
      height: 20px !important; 
    }

    /* ЭКРАНЫ СЕКЦИЙ */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ПРОФИЛЬ */
    .profile-card { background: #161616; border: 1px solid #222222; border-radius: 16px; padding: 24px 20px; text-align: center; margin-top: 20px; }
    .profile-avatar { width: 70px; height: 70px; border-radius: 50%; background: #262626; margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #8c8c8c; }

    /* КОРЗИНА */
    .cart-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 120px; }
    .cart-item { display: flex; align-items: center; background: #161616; border: 1px solid #222222; border-radius: 12px; padding: 10px; gap: 12px; position: relative; }
    .cart-item-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #222; flex-shrink: 0; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-title { font-size: 14px; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .cart-item-price { font-size: 14px; font-weight: 700; color: #ffffff; }
    .cart-item-remove { background: none; border: none; color: #8c8c8c; font-size: 18px; padding: 4px 8px; cursor: pointer; }

    .cart-checkout-bar {
      position: fixed;
      bottom: 60px;
      left: 0;
      right: 0;
      background: #161616;
      border-top: 1px solid #262626;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 15;
    }
    .cart-total-label { font-size: 11px; color: #8c8c8c; text-transform: uppercase; letter-spacing: 0.5px; }
    .cart-total-price { font-size: 18px; font-weight: 800; color: #ffffff; margin-top: 2px; }
    .btn-checkout {
      background: #ffffff;
      color: #0d0d0d;
      border: none;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-checkout:active { opacity: 0.8; }

    /* НИЖНЕЕ МЕНЮ */
    .nav-bar { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      background: #111111; 
      border-top: 1px solid #222222; 
      display: flex; 
      justify-content: space-around; 
      padding: 10px 0 8px 0; 
      z-index: 20;
    }
    .nav-item { 
      color: #8c8c8c; 
      font-size: 11px; 
      font-weight: 500;
      text-decoration: none; 
      text-align: center; 
      cursor: pointer; 
      flex: 1; 
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }
    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: #8c8c8c;
      fill: none;
      transition: stroke 0.2s, transform 0.1s;
    }
    .nav-item:active { transform: scale(0.95); }
    .nav-item.active { color: #ffffff; font-weight: 700; }
    .nav-item.active svg { stroke: #ffffff; transform: scale(1.08); }

    #loading { text-align: center; color: #8c8c8c; padding: 20px; font-size: 13px; }

    /* МОДАЛЬНОЕ ОКНО */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0d0d0d; z-index: 100; overflow-y: auto; padding: 16px; padding-bottom: 90px; }
    
    .modal-close { 
      position: absolute; 
      top: 24px; 
      left: 24px; 
      background: transparent !important; 
      border: none !important; 
      outline: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      width: 36px !important; 
      height: 36px !important; 
      cursor: pointer; 
      z-index: 101; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      transition: transform 0.15s ease;
    }
    .modal-close:active { transform: scale(0.85); }
    .modal-close svg { width: 20px !important; height: 20px !important; stroke: #8c8c8c !important; }

    .modal-fav-btn {
      position: absolute; 
      top: 24px; 
      right: 24px; 
      background: transparent !important; 
      border: none !important; 
      outline: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      width: 36px !important; 
      height: 36px !important; 
      cursor: pointer; 
      z-index: 101; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      transition: transform 0.15s ease;
    }
    .modal-fav-btn:active { transform: scale(0.85); }
    .modal-fav-btn svg { width: 20px !important; height: 20px !important; pointer-events: none; }

    .modal-img { width: 100%; height: 320px; object-fit: cover; border-radius: 16px; margin-bottom: 16px; }
    .modal-shop { font-size: 12px; font-weight: 700; color: #8c8c8c; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
    .modal-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    .modal-price { font-size: 20px; font-weight: 800; color: #ffffff; margin-bottom: 12px; }
    
    .modal-tags { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tag { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 6px 12px; border-radius: 8px; font-size: 12px; color: #a0a0a0; }
    .modal-desc { font-size: 14px; color: #cccccc; line-height: 1.5; margin-bottom: 24px; white-space: pre-line; }
    
    .modal-actions { position: fixed; bottom: 20px; left: 16px; right: 16px; display: flex; gap: 10px; z-index: 102; }
    .btn-buy, a.btn-buy { flex: 2; background-color: #8c8c8c !important; color: #0d0d0d !important; border: none !important; text-align: center; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 14px; text-decoration: none; }
    .btn-cart-add { flex: 1; background-color: #1f1f1f; color: #ffffff; border: 1px solid #333; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; text-align: center; }
  /* ГАЛЕРЕЯ В МОДАЛКЕ */
.modal-gallery {
  position: relative;
  width: 100%;
  margin-bottom: 16px;
  border-radius: 16px;
  overflow: hidden;
  background: #1a1a1a;
}

.gallery-track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

.gallery-track::-webkit-scrollbar {
  display: none;
}

.gallery-slide {
  flex: 0 0 100%;
  scroll-snap-align: center;
  height: 320px;
}

.gallery-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
  user-select: none;
}

/* Точки-индикаторы */
.gallery-dots {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  padding: 6px 10px;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 20px;
  backdrop-filter: blur(10px);
  z-index: 5;
}

.gallery-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.4);
  transition: all 0.2s;
  cursor: pointer;
}

.gallery-dot.active {
  background: #ffffff;
  width: 18px;
  border-radius: 3px;
}

/* Счётчик фото (если 1 фото — не показываем) */
.gallery-counter {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  z-index: 5;
}
 /* БЛОК ВЫБОРА РАЗМЕРА */
.size-section {
  margin-bottom: 16px;
}
.size-label {
  font-size: 12px;
  font-weight: 600;
  color: #8c8c8c;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.size-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.size-chip {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  color: #cccccc;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  min-width: 48px;
  text-align: center;
}
.size-chip:active {
  transform: scale(0.95);
}
.size-chip.selected {
  background: #ffffff;
  color: #0d0d0d;
  border-color: #ffffff;
}
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <div class="header">
    <div class="logo"><span>RE:</span>WEAR</div>
    <div class="cart-btn" onclick="switchTab('cart')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <div id="cart-count" class="cart-badge">0</div>
    </div>
  </div>

  <!-- 1. ГЛАВНАЯ -->
  <div id="tab-home" class="tab-content active">

    <!-- ПОИСК И КНОПКА ФИЛЬТРА -->
    <div class="search-filter-row">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Поиск по названию или бренду..." oninput="applyFilters()">
      </div>
      <button type="button" id="filter-btn" class="filter-trigger-btn" onclick="toggleFilterPanel()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
        Фильтры
      </button>
    </div>

    <!-- ВЫПАДАЮЩАЯ ПАНЕЛЬ ФИЛЬТРОВ И СОРТИРОВКИ -->
    <div id="filter-panel" class="filter-panel">
      <!-- СОРТИРОВКА -->
      <div class="filter-group">
        <label class="filter-label">Сортировка по цене</label>
        <select id="filter-sort" class="filter-select" onchange="applyFilters()">
          <option value="default">По умолчанию (Новые)</option>
          <option value="price-asc">Сначала дешевле (по возрастанию)</option>
          <option value="price-desc">Сначала дороже (по убыванию)</option>
        </select>
      </div>

      <!-- ФИЛЬТР ПО ПРОДАВЦУ / ШОПУ -->
      <div class="filter-group">
        <label class="filter-label">Магазин (Шоп)</label>
        <select id="filter-shop" class="filter-select" onchange="applyFilters()">
          <option value="all">Все магазины</option>
        </select>
      </div>

      <!-- ФИЛЬТР ПО ЦЕНЕ -->
      <div class="filter-group">
        <label class="filter-label">Диапазон цены (сум)</label>
        <div class="price-range">
          <input type="number" id="filter-price-min" class="price-input" placeholder="От" oninput="applyFilters()">
          <input type="number" id="filter-price-max" class="price-input" placeholder="До" oninput="applyFilters()">
        </div>
      </div>

      <div class="filter-actions">
        <button type="button" class="btn-apply-filter" onclick="toggleFilterPanel()">Применить</button>
        <button type="button" class="btn-reset-filter" onclick="resetFilters()">Сбросить</button>
      </div>
    </div>

    <!-- КАТЕГОРИИ (ЧИПЫ) -->
    <div class="categories-bar">
      <button class="cat-chip active" onclick="filterCategory('все', this)">Все</button>
      <button class="cat-chip" onclick="filterCategory('ветровки', this)">Ветровки</button>
      <button class="cat-chip" onclick="filterCategory('худи', this)">Худи</button>
      <button class="cat-chip" onclick="filterCategory('футболки', this)">Футболки</button>
      <button class="cat-chip" onclick="filterCategory('штаны', this)">Штаны</button>
    </div>

    <div id="loading">Загрузка товаров...</div>
    <div class="grid" id="catalog-grid" style="display: none;"></div>
  </div>

  <!-- 2. ИЗБРАННОЕ -->
  <div id="tab-favorites" class="tab-content">
    <div class="section-title">Избранное</div>
    <div class="grid" id="favorites-grid"></div>
    <div id="fav-empty" style="text-align: center; color: #8c8c8c; padding: 40px 0;">У вас пока нет сохранённых товаров.</div>
  </div>

  <!-- 3. КОРЗИНА -->
  <div id="tab-cart" class="tab-content">
    <div class="section-title">Корзина</div>
    <div class="cart-list" id="cart-list"></div>
    <div id="cart-empty" style="text-align: center; color: #8c8c8c; padding: 40px 0;">Корзина пуста.</div>

    <div id="cart-checkout-bar" class="cart-checkout-bar" style="display: none;">
      <div>
        <div class="cart-total-label">Итого (<span id="cart-total-count">0</span>):</div>
        <div class="cart-total-price" id="cart-total-sum">0 сум</div>
      </div>
      <button class="btn-checkout" onclick="checkoutCart()">Купить</button>
    </div>
  </div>

  <!-- 4. ПРОФИЛЬ -->
  <div id="tab-profile" class="tab-content">
    <div class="section-title">Мой профиль</div>
    <div class="profile-card">
      <div class="profile-avatar">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <h3 id="user-name" style="margin-bottom: 4px;">Пользователь</h3>
      <p id="user-handle" style="color: #8c8c8c; font-size: 13px;">@username</p>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ТОВАРА -->
  <div id="product-modal" class="modal">
    <button class="modal-close" onclick="closeProduct()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    
    <button class="modal-fav-btn" onclick="toggleFavFromModal()">
      <svg id="m-fav-icon" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    </button>

    <div class="modal-gallery">
  <div class="gallery-track" id="m-gallery-track"></div>
  <div class="gallery-dots" id="m-gallery-dots"></div>
</div>
    <div id="m-shop" class="modal-shop"></div>
    <div id="m-title" class="modal-title"></div>
    <div id="m-price" class="modal-price"></div>
   <div class="modal-tags">
  <span id="m-category" class="tag"></span>
</div>
<div class="size-section" id="m-size-section" style="display: none;">
  <div class="size-label">Выберите размер:</div>
  <div class="size-options" id="m-size-options"></div>
</div>
    <div id="m-desc" class="modal-desc"></div>
    
    <div class="modal-actions">
      <a id="m-buy-btn" href="#" target="_blank" class="btn-buy">Написать продавцу</a>
      <button id="m-cart-btn" class="btn-cart-add" onclick="toggleCartFromModal()">В корзину</button>
    </div>
  </div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <div class="nav-bar">

      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <polyline points="9 22 9 12 15 12 15 22"></polyline>

    <div class="nav-item" onclick="switchTab('favorites', this)">

        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const SUPABASE_URL = 'https://lseatoyffptmjljinswp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZWF0b3lmZnB0bWpsamluc3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDA2MTEsImV4cCI6MjEwNjI3NjYxMX0.Cv10pBFfb8VwlLgVI-jVrjZ1Bregum2NozVKYwxs6tM';
    const ADMIN_USERNAME = 'KYJITYPA'; // Твой Telegram юзернейм

    let loadedProducts = [];
    let selectedCategory = 'все';
    
    let favorites = JSON.parse(localStorage.getItem('rewear_favs') || '[]');
    let cart = JSON.parse(localStorage.getItem('rewear_cart') || '[]');
    let activeModalIndex = null;

    function saveState() {
      localStorage.setItem('rewear_favs', JSON.stringify(favorites));
      localStorage.setItem('rewear_cart', JSON.stringify(cart));
      updateCartBadge();
    }

    async function initAndLoad() {
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        document.getElementById('user-name').innerText = (user.first_name || '') + ' ' + (user.last_name || '');
        document.getElementById('user-handle').innerText = user.username ? '@' + user.username : 'Telegram User';
      }

      updateCartBadge();

      const loadingEl = document.getElementById('loading');

      try {
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data: products, error } = await client.from('products').select('*');

        if (error) throw error;

        if (!products || products.length === 0) {
          loadingEl.innerText = "В каталоге пока нет товаров.";
          return;
        }

        loadedProducts = products;
        populateShopFilter(loadedProducts);
        renderProducts(loadedProducts);

      } catch (err) {
        console.error(err);
        loadingEl.style.color = "#ff4d4d";
        loadingEl.innerText = "Ошибка загрузки: " + err.message;
      }
    }

    // Автоматически заполняем список шопов в фильтре на основе загруженных товаров
    function populateShopFilter(products) {
      const shopSelect = document.getElementById('filter-shop');
      const shops = new Set();

      products.forEach(p => {
        if (p.shop && p.shop.trim() !== '') {
          shops.add(p.shop.trim());
        }
      });

      shopSelect.innerHTML = '<option value="all">Все магазины</option>';
      shops.forEach(shopName => {
        const opt = document.createElement('option');
        opt.value = shopName;
        opt.innerText = shopName;
        shopSelect.appendChild(opt);
      });
    }

    function toggleFilterPanel() {
      const panel = document.getElementById('filter-panel');
      const btn = document.getElementById('filter-btn');
      panel.classList.toggle('open');
      btn.classList.toggle('active');
    }

    // Комплексная фильтрация + Сортировка по цене
    function applyFilters() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedShop = document.getElementById('filter-shop').value;
      const minPrice = parseFloat(document.getElementById('filter-price-min').value) || 0;
      const maxPrice = parseFloat(document.getElementById('filter-price-max').value) || Infinity;
      const sortType = document.getElementById('filter-sort').value;

      let filtered = loadedProducts.filter(product => {
        // 1. Поиск по тексту
        const titleMatch = (product.title || '').toLowerCase().includes(searchQuery);
        const descMatch = (product.description || '').toLowerCase().includes(searchQuery);
        const shopTextMatch = (product.shop || '').toLowerCase().includes(searchQuery);
        const searchMatches = titleMatch || descMatch || shopTextMatch;

        // 2. Категория
        const catLower = selectedCategory.toLowerCase();
        const categoryMatches = (catLower === 'все') || (product.category && product.category.toLowerCase().includes(catLower));

        // 3. Продавец
        const shopMatches = (selectedShop === 'all') || (product.shop === selectedShop);

        // 4. Цена
        const price = Number(product.price || 0);
        const priceMatches = price >= minPrice && price <= maxPrice;

        return searchMatches && categoryMatches && shopMatches && priceMatches;
      });

      // Логика сортировки по цене
      if (sortType === 'price-asc') {
        filtered.sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
      } else if (sortType === 'price-desc') {
        filtered.sort((a, b) => Number(b.price || 0) - Number(a.price || 0));
      }

      renderProducts(filtered);
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-shop').value = 'all';
      document.getElementById('filter-sort').value = 'default';
      document.getElementById('filter-price-min').value = '';
      document.getElementById('filter-price-max').value = '';
      selectedCategory = 'все';
      
      document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
      document.querySelector('.cat-chip').classList.add('active');

      applyFilters();
    }

    function filterCategory(category, element) {
      document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
      if (element) element.classList.add('active');
      selectedCategory = category;
      applyFilters();
    }

    function renderProducts(products) {
      const loadingEl = document.getElementById('loading');
      const gridEl = document.getElementById('catalog-grid');

      gridEl.innerHTML = '';

      if (products.length === 0) {
        loadingEl.style.display = 'block';
        loadingEl.innerText = "Товары по вашему запросу не найдены.";
        gridEl.style.display = 'none';
        return;
      }

      loadingEl.style.display = 'none';
      gridEl.style.display = 'grid';

      products.forEach((product) => {
        const originalIndex = loadedProducts.indexOf(product);
        let imageUrl = 'https://images.unsplash.com/photo-1544441893-675973e31985?w=500';
        if (product.image_urls) {
          imageUrl = Array.isArray(product.image_urls) ? product.image_urls[0] : product.image_urls;
          imageUrl = imageUrl.replace(/[\{\}\"\']/g, '');
        }

        const isFav = favorites.includes(String(product.id));
        const priceVal = Number(product.price || 0).toLocaleString('ru-RU');
        const shopName = product.shop || 'RE:WEAR Select';

        const cardHtml = `
          <div class="card" onclick="openProduct(${originalIndex})">
            <button type="button" class="card-fav-btn" onclick="toggleFav(event, '${product.id}')">
              <svg id="fav-icon-${product.id}" viewBox="0 0 24 24" fill="${isFav ? '#ff4d4d' : 'none'}" stroke="${isFav ? '#ff4d4d' : '#8c8c8c'}" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </button>
            <img class="card-img" src="${imageUrl}" alt="${product.title || ''}">
            <div class="card-info">
              <div class="card-shop">${shopName}</div>
              <div class="card-title">${product.title || 'Без названия'}</div>
              <div class="card-price">${priceVal} сум</div>
              <div class="card-meta">${product.category || 'Без категории'}</div>
            </div>
          </div>
        `;
        gridEl.innerHTML += cardHtml;
      });
    }

    function switchTab(tabName, element) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById('tab-' + tabName).classList.add('active');

      if (element) {
        element.classList.add('active');
      } else {
        const items = document.querySelectorAll('.nav-item');
        if (tabName === 'home' && items[0]) items[0].classList.add('active');
        if (tabName === 'favorites' && items[1]) items[1].classList.add('active');
        if (tabName === 'profile' && items[2]) items[2].classList.add('active');
      }

      if (tabName === 'favorites') renderFavorites();
      if (tabName === 'cart') renderCart();
    }

    function toggleFav(e, id) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }

      const strId = String(id);

      if (favorites.includes(strId)) {
        favorites = favorites.filter(item => item !== strId);
      } else {
        favorites.push(strId);
      }

      saveState();

      const svgIcon = document.getElementById('fav-icon-' + strId);
      if (svgIcon) {
        const isFav = favorites.includes(strId);
        svgIcon.setAttribute('fill', isFav ? '#ff4d4d' : 'none');
        svgIcon.setAttribute('stroke', isFav ? '#ff4d4d' : '#8c8c8c');
      }

      renderFavorites();
    }

    function toggleFavFromModal() {
      if (activeModalIndex === null) return;
      const p = loadedProducts[activeModalIndex];
      toggleFav(null, p.id);
      updateModalFavIcon(p.id);
    }

    function updateModalFavIcon(id) {
      const isFav = favorites.includes(String(id));
      const mFavIcon = document.getElementById('m-fav-icon');
      if (mFavIcon) {
        mFavIcon.setAttribute('fill', isFav ? '#ff4d4d' : 'none');
        mFavIcon.setAttribute('stroke', isFav ? '#ff4d4d' : '#8c8c8c');
      }
    }

    function renderFavorites() {
      const grid = document.getElementById('favorites-grid');
      const empty = document.getElementById('fav-empty');
      const favProducts = loadedProducts.filter(p => favorites.includes(String(p.id)));

      grid.innerHTML = '';
      if (favProducts.length === 0) {
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        favProducts.forEach(product => {
          const originalIndex = loadedProducts.indexOf(product);
          let imageUrl = product.image_urls ? (Array.isArray(product.image_urls) ? product.image_urls[0] : product.image_urls).replace(/[\{\}\"\']/g, '') : '';
          grid.innerHTML += `
            <div class="card" onclick="openProduct(${originalIndex})">
              <button type="button" class="card-fav-btn" onclick="toggleFav(event, '${product.id}')">
                <svg id="fav-icon-${product.id}" viewBox="0 0 24 24" fill="#ff4d4d" stroke="#ff4d4d" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
              <img class="card-img" src="${imageUrl}">
              <div class="card-info">
                <div class="card-shop">${product.shop || 'RE:WEAR Select'}</div>
                <div class="card-title">${product.title}</div>
                <div class="card-price">${Number(product.price).toLocaleString('ru-RU')} сум</div>
              </div>
            </div>
          `;
        });
      }
    }

    function toggleCartFromModal() {
      if (activeModalIndex === null) return;
      const p = loadedProducts[activeModalIndex];
      const strId = String(p.id);

      if (cart.includes(strId)) {
        cart = cart.filter(id => id !== strId);
      } else {
        cart.push(strId);
      }
      saveState();
      closeProduct();
    }

    function removeFromCart(id) {
      const strId = String(id);
      cart = cart.filter(itemId => itemId !== strId);
      saveState();
      renderCart();
    }

    function updateCartBadge() {
      document.getElementById('cart-count').innerText = cart.length;
    }

    function renderCart() {
      const listEl = document.getElementById('cart-list');
      const emptyEl = document.getElementById('cart-empty');
      const checkoutBar = document.getElementById('cart-checkout-bar');
      const cartProducts = loadedProducts.filter(p => cart.includes(String(p.id)));

      listEl.innerHTML = '';
      if (cartProducts.length === 0) {
        emptyEl.style.display = 'block';
        checkoutBar.style.display = 'none';
      } else {
        emptyEl.style.display = 'none';
        checkoutBar.style.display = 'flex';

        let totalSum = 0;

        cartProducts.forEach(product => {
          totalSum += Number(product.price || 0);
          let imageUrl = product.image_urls ? (Array.isArray(product.image_urls) ? product.image_urls[0] : product.image_urls).replace(/[\{\}\"\']/g, '') : '';
          
          listEl.innerHTML += `
            <div class="cart-item">
              <img class="cart-item-img" src="${imageUrl}" alt="${product.title}">
              <div class="cart-item-info">
                <div class="cart-item-title">${product.title || 'Без названия'}</div>
                <div class="cart-item-price">${Number(product.price || 0).toLocaleString('ru-RU')} сум</div>
              </div>
              <button class="cart-item-remove" onclick="removeFromCart('${product.id}')">✕</button>
            </div>
          `;
        });

        document.getElementById('cart-total-count').innerText = cartProducts.length;
        document.getElementById('cart-total-sum').innerText = totalSum.toLocaleString('ru-RU') + ' сум';
      }
    }

    async function checkoutCart() {
  const cartProducts = loadedProducts.filter(p => cart.includes(String(p.id)));
  if (cartProducts.length === 0) return;

  let total = 0;
  const itemsForOrder = cartProducts.map(p => {
    total += Number(p.price || 0);
    return {
      id: p.id,
      title: p.title || 'Без названия',
      price: Number(p.price || 0),
      size: p.size || '',
      shop: p.shop || ''
    };
  });

  const user = (tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  const buyerName = ((user.first_name || '') + ' ' + (user.last_name || '')).trim() || 'Без имени';
  const buyerUsername = user.username || '';

  // 1. Сохраняем заказ в Supabase
  let orderId = null;
  try {
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data, error } = await client.from('orders').insert({
      buyer_tg_id: user.id || null,
      buyer_username: buyerUsername,
      buyer_name: buyerName,
      items: itemsForOrder,
      total_sum: total,
      status: 'new'
    }).select().single();

    if (error) throw error;
    orderId = data.id;
  } catch (err) {
    console.error('Ошибка сохранения заказа:', err);
    tg.showAlert('Не удалось сохранить заказ. Попробуйте ещё раз.');
    return;
  }

  // 2. Отправляем уведомление тебе в ТГ
  try {
    await fetch('https://lseatoyffptmjljinswp.supabase.co/functions/v1/notify-order', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        id: orderId,
        buyer_name: buyerName,
        buyer_username: buyerUsername,
        items: itemsForOrder,
        total_sum: total
      })
    });
  } catch (err) {
    console.error('Ошибка отправки уведомления:', err);
    // Не прерываем — заказ уже сохранён
  }

  // 3. Открываем чат с тобой (как раньше)
  let message = `Здравствуйте! Оформил заказ #${orderId} в RE:WEAR:\n\n`;
  cartProducts.forEach((p, idx) => {
    const shopInfo = p.shop ? ` [Шоп: ${p.shop}]` : '';
    message += `${idx + 1}. ${p.title} (Размер: ${p.size || 'не указан'})${shopInfo} — ${Number(p.price || 0).toLocaleString('ru-RU')} сум\n`;
  });
  message += `\nИтого: ${total.toLocaleString('ru-RU')} сум`;

  const targetUrl = `https://t.me/${ADMIN_USERNAME}?text=${encodeURIComponent(message)}`;

  // 4. Чистим корзину
  cart = [];
  saveState();
  renderCart();

  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink(targetUrl);
  } else {
    window.open(targetUrl, '_blank');
  }
}

   function openProduct(index) {
  activeModalIndex = index;
  const p = loadedProducts[index];
  if (!p) return;

  // Собираем массив фото
  let images = [];
  if (p.image_urls) {
    if (Array.isArray(p.image_urls)) {
      images = p.image_urls.map(u => String(u).replace(/[\{\}\"\']/g, '').trim()).filter(Boolean);
    } else {
      const cleaned = String(p.image_urls).replace(/[\{\}\"\']/g, '').trim();
      images = cleaned ? [cleaned] : [];
    }
  }
  if (images.length === 0) {
    images = ['https://images.unsplash.com/photo-1544441893-675973e31985?w=500'];
  }

  renderGallery(images);

  document.getElementById('m-shop').innerText = p.shop || 'RE:WEAR Select';
  document.getElementById('m-title').innerText = p.title || 'Без названия';
  document.getElementById('m-price').innerText = Number(p.price || 0).toLocaleString('ru-RU') + ' сум';
  
  document.getElementById('m-category').innerText = 'Категория: ' + (p.category || '—');
     renderSizeOptions(p.sizes || []);
  
  document.getElementById('m-desc').innerText = p.description || 'Описание отсутствует.';
  
  const shopMention = p.shop ? ` [Шоп: ${p.shop}]` : '';
  const directMsg = encodeURIComponent(`Здравствуйте! Меня интересует: ${p.title}${shopMention} (${Number(p.price || 0).toLocaleString('ru-RU')} сум)`);
  document.getElementById('m-buy-btn').href = `https://t.me/${ADMIN_USERNAME}?text=${directMsg}`;
  
  const cartBtn = document.getElementById('m-cart-btn');
  cartBtn.innerText = cart.includes(String(p.id)) ? '✓ В корзине' : 'В корзину';

  updateModalFavIcon(p.id);

  document.getElementById('product-modal').style.display = 'block';
  tg.BackButton.show();
  tg.BackButton.onClick(closeProduct);
}

// Отрисовка галереи
function renderGallery(images) {
  const track = document.getElementById('m-gallery-track');
  const dotsEl = document.getElementById('m-gallery-dots');

  track.innerHTML = '';
  dotsEl.innerHTML = '';

  images.forEach((url, i) => {
    track.innerHTML += `
      <div class="gallery-slide">
        <img src="${url}" alt="Фото ${i + 1}" onerror="this.src='https://images.unsplash.com/photo-1544441893-675973e31985?w=500'">
      </div>
    `;
    dotsEl.innerHTML += `<div class="gallery-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`;
  });

  // Точки показываем только если фото больше 1
if (images.length > 1) {
  dotsEl.style.display = 'flex';
} else {
  dotsEl.style.display = 'none';
}

// Обновляем активную точку при скролле
let scrollTimeout;
track.onscroll = () => {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const slideWidth = track.clientWidth;
    const currentIndex = Math.round(track.scrollLeft / slideWidth);
    updateGalleryUI(currentIndex);
  }, 50);
};
}

function updateGalleryUI(index) {
  document.querySelectorAll('.gallery-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === index);
  });
}

function goToSlide(index) {
  const track = document.getElementById('m-gallery-track');
  const slideWidth = track.clientWidth;
  track.scrollTo({ left: slideWidth * index, behavior: 'smooth' });
}

    function closeProduct() {
  document.getElementById('product-modal').style.display = 'none';
  tg.BackButton.hide();
  activeModalIndex = null;
  // Сброс галереи при закрытии
  const track = document.getElementById('m-gallery-track');
  if (track) track.scrollLeft = 0;
}

  // === ВЫБОР РАЗМЕРА ===
let selectedSize = null;

function renderSizeOptions(sizes) {
  const section = document.getElementById('m-size-section');
  const optionsEl = document.getElementById('m-size-options');

  let cleanSizes = [];
  if (Array.isArray(sizes)) {
    cleanSizes = sizes.map(s => String(s).replace(/[\{\}\"\']/g, '').trim()).filter(Boolean);
  } else if (typeof sizes === 'string' && sizes.trim()) {
    cleanSizes = sizes.replace(/[\{\}\"\']/g, '').split(',').map(s => s.trim()).filter(Boolean);
  }

  selectedSize = null;

  if (cleanSizes.length === 0) {
    section.style.display = 'none';
    optionsEl.innerHTML = '';
    return;
  }

  if (cleanSizes.length === 1) {
    selectedSize = cleanSizes[0];
    section.style.display = 'none';
    optionsEl.innerHTML = '';
    return;
  }

  section.style.display = 'block';
  optionsEl.innerHTML = '';
  cleanSizes.forEach(size => {
    const chip = document.createElement('div');
    chip.className = 'size-chip';
    chip.innerText = size;
    chip.onclick = () => selectSize(size, chip);
    optionsEl.appendChild(chip);
  });
}

function selectSize(size, chipEl) {
  selectedSize = size;
  document.querySelectorAll('#m-size-options .size-chip').forEach(chip => {
    chip.classList.remove('selected');
  });
  if (chipEl) chipEl.classList.add('selected');
}
