<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RE:WEAR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d0d0d !important; color: #ffffff !important; padding: 16px; padding-bottom: 80px; }
    
    /* ШАПКА С ИКОНКОЙ КОРЗИНЫ */
    .header { text-align: center; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: 800; letter-spacing: 2px; }
    .logo span { color: #8c8c8c; }
    .cart-btn { position: relative; background: #161616; border: 1px solid #262626; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
    .cart-badge { position: absolute; top: -4px; right: -4px; background: #8c8c8c; color: #0d0d0d; font-size: 10px; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    .banner { background: #161616; border-radius: 16px; padding: 20px; margin-bottom: 24px; border: 1px solid #222222; text-align: left;}
    .banner h2 { font-size: 20px; margin-bottom: 8px; font-weight: 700; color: #ffffff; }
    .banner p { font-size: 13px; color: #a0a0a0; margin-bottom: 16px; }
    
    .btn-main, button.btn-main { 
      background-color: #8c8c8c !important; 
      color: #0d0d0d !important; 
      border: none !important; 
      padding: 10px 20px; 
      border-radius: 20px; 
      font-weight: 700; 
      font-size: 13px; 
      cursor: pointer; 
      text-decoration: none; 
      display: inline-block; 
      transition: opacity 0.2s; 
    }
    .btn-main:active { opacity: 0.8; }
    
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #ffffff; }
    
    /* КАТЕГОРИИ */
    .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-chip { background: #161616; color: #8c8c8c; border: 1px solid #262626; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
    .cat-chip.active { background: #ffffff; color: #0d0d0d; border-color: #ffffff; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .card { background: #161616; border-radius: 12px; overflow: hidden; border: 1px solid #222222; position: relative; cursor: pointer; }
    .card-img { width: 100%; height: 160px; object-fit: cover; background: #222; display: block; }
    .card-info { padding: 10px; }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ffffff; }
    .card-price { font-size: 14px; font-weight: 700; color: #ffffff; }
    .card-meta { font-size: 11px; color: #8c8c8c; margin-top: 4px; }
    .card-fav-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5); border: none; border-radius: 50%; width: 30px; height: 30px; color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .card-fav-btn.active { color: #ff4d4d; }

    /* ЭКРАНЫ СЕКЦИЙ */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ПРОФИЛЬ И СЕКЦИИ-ПУСТЫШКИ */
    .profile-card { background: #161616; border: 1px solid #222222; border-radius: 16px; padding: 20px; text-align: center; margin-top: 20px; }
    .profile-avatar { width: 70px; height: 70px; border-radius: 50%; background: #262626; margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center; font-size: 28px; }

    /* НИЖНЕЕ МЕНЮ */
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0d0d0d; border-top: 1px solid #222; display: flex; justify-around; padding: 12px 0; z-index: 10;}
    .nav-item { color: #8c8c8c; font-size: 11px; text-decoration: none; text-align: center; cursor: pointer; flex: 1; }
    .nav-item.active { color: #ffffff; font-weight: 600; }
    #loading { text-align: center; color: #8c8c8c; padding: 20px; font-size: 13px; }

    /* МОДАЛЬНОЕ ОКНО */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0d0d0d; z-index: 100; overflow-y: auto; padding: 16px; padding-bottom: 90px; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 101; }
    .modal-img { width: 100%; height: 320px; object-fit: cover; border-radius: 16px; margin-bottom: 16px; }
    .modal-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    .modal-price { font-size: 20px; font-weight: 800; color: #ffffff; margin-bottom: 12px; }
    .modal-tags { display: flex; gap: 8px; margin-bottom: 16px; }
    .tag { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 6px 12px; border-radius: 8px; font-size: 12px; color: #a0a0a0; }
    .modal-desc { font-size: 14px; color: #cccccc; line-height: 1.5; margin-bottom: 24px; white-space: pre-line; }
    
    .modal-actions { position: fixed; bottom: 20px; left: 16px; right: 16px; display: flex; gap: 10px; z-index: 102; }
    .btn-buy, a.btn-buy { flex: 2; background-color: #8c8c8c !important; color: #0d0d0d !important; border: none !important; text-align: center; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 14px; text-decoration: none; }
    .btn-cart-add { flex: 1; background-color: #1f1f1f; color: #ffffff; border: 1px solid #333; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; text-align: center; }
  </style>
</head>
<body>

  <!-- ВЕРХНЯЯ ШАПКА ПРИЛОЖЕНИЯ -->
  <div class="header">
    <div class="logo"><span>RE:</span>WEAR</div>
    <div class="cart-btn" onclick="switchTab('cart')">
      🛒
      <div id="cart-count" class="cart-badge">0</div>
    </div>
  </div>

  <!-- 1. ЭКРАН ГЛАВНОЙ -->
  <div id="tab-home" class="tab-content active">
    <div class="banner">
      <h2>Вещи, которые имеют историю.</h2>
      <p>Лучшие вещи не стареют. Они просто ждут своего человека.</p>
      <button type="button" onclick="scrollToCatalog()" class="btn-main">Перейти к каталогу &rarr;</button>
    </div>

    <div id="catalog-section" class="section-title">Каталог товаров</div>

    <div class="categories-bar">
      <button class="cat-chip active" onclick="filterCategory('все', this)">Все</button>
      <button class="cat-chip" onclick="filterCategory('ветровки', this)">Ветровки</button>
      <button class="cat-chip" onclick="filterCategory('худи', this)">Худи</button>
      <button class="cat-chip" onclick="filterCategory('футболки', this)">Футболки</button>
    </div>

    <div id="loading">Загрузка товаров...</div>
    <div class="grid" id="catalog-grid" style="display: none;"></div>
  </div>

  <!-- 2. ЭКРАН ИЗБРАННОГО -->
  <div id="tab-favorites" class="tab-content">
    <div class="section-title">Избранное</div>
    <div class="grid" id="favorites-grid"></div>
    <div id="fav-empty" style="text-align: center; color: #8c8c8c; padding: 40px 0;">У вас пока нет сохранённых товаров.</div>
  </div>

  <!-- 3. ЭКРАН КОРЗИНЫ -->
  <div id="tab-cart" class="tab-content">
    <div class="section-title">Корзина</div>
    <div class="grid" id="cart-grid"></div>
    <div id="cart-empty" style="text-align: center; color: #8c8c8c; padding: 40px 0;">Корзина пуста.</div>
  </div>

  <!-- 4. ЭКРАН ПРОФИЛЯ -->
  <div id="tab-profile" class="tab-content">
    <div class="section-title">Мой профиль</div>
    <div class="profile-card">
      <div class="profile-avatar">👤</div>
      <h3 id="user-name" style="margin-bottom: 4px;">Пользователь</h3>
      <p id="user-handle" style="color: #8c8c8c; font-size: 13px;">@username</p>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ТОВАРА -->
  <div id="product-modal" class="modal">
    <button class="modal-close" onclick="closeProduct()">✕</button>
    <img id="m-img" class="modal-img" src="" alt="">
    <div id="m-title" class="modal-title"></div>
    <div id="m-price" class="modal-price"></div>
    <div class="modal-tags">
      <span id="m-category" class="tag"></span>
      <span id="m-condition" class="tag"></span>
    </div>
    <div id="m-desc" class="modal-desc"></div>
    
    <div class="modal-actions">
      <a id="m-buy-btn" href="#" target="_blank" class="btn-buy">Написать продавцу</a>
      <button id="m-cart-btn" class="btn-cart-add" onclick="toggleCartFromModal()">🛒</button>
    </div>
  </div>

  <!-- НИЖНЕЕ МЕНЮ (НАВИГАЦИЯ) -->
  <div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('home', this)">Главная</div>
    <div class="nav-item" onclick="switchTab('favorites', this)">Избранное</div>
    <div class="nav-item" onclick="switchTab('profile', this)">Профиль</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const SUPABASE_URL = 'https://lseatoyffptmjljinswp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZWF0b3lmZnB0bWpsamluc3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDA2MTEsImV4cCI6MjEwNjI3NjYxMX0.Cv10pBFfb8VwlLgVI-jVrjZ1Bregum2NozVKYwxs6tM';

    let loadedProducts = [];
    let favorites = [];
    let cart = [];
    let activeModalIndex = null;

    async function initAndLoad() {
      // Telegram Profile info
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        document.getElementById('user-name').innerText = (user.first_name || '') + ' ' + (user.last_name || '');
        document.getElementById('user-handle').innerText = user.username ? '@' + user.username : 'Telegram User';
      }

      const loadingEl = document.getElementById('loading');

      try {
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data: products, error } = await client.from('products').select('*');

        if (error) throw error;

        if (!products || products.length === 0) {
          loadingEl.innerText = "В каталоге пока нет товаров.";
          return;
        }

        loadedProducts = products;
        renderProducts(loadedProducts);

      } catch (err) {
        console.error(err);
        loadingEl.style.color = "#ff4d4d";
        loadingEl.innerText = "Ошибка загрузки: " + err.message;
      }
    }

    function renderProducts(products) {
      const loadingEl = document.getElementById('loading');
      const gridEl = document.getElementById('catalog-grid');

      gridEl.innerHTML = '';

      if (products.length === 0) {
        loadingEl.style.display = 'block';
        loadingEl.innerText = "В этой категории нет товаров.";
        gridEl.style.display = 'none';
        return;
      }

      loadingEl.style.display = 'none';
      gridEl.style.display = 'grid';

      products.forEach((product) => {
        const originalIndex = loadedProducts.indexOf(product);
        let imageUrl = 'https://images.unsplash.com/photo-1544441893-675973e31985?w=500';
        if (product.image_urls) {
          imageUrl = Array.isArray(product.image_urls) ? product.image_urls[0] : product.image_urls;
          imageUrl = imageUrl.replace(/[\{\}\"\']/g, '');
        }

        const isFav = favorites.includes(product.id);
        const priceVal = Number(product.price || 0).toLocaleString('ru-RU');

        const cardHtml = `
          <div class="card" onclick="openProduct(${originalIndex})">
            <button class="card-fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${product.id}')">
              ${isFav ? '♥' : '♡'}
            </button>
            <img class="card-img" src="${imageUrl}" alt="${product.title || ''}">
            <div class="card-info">
              <div class="card-title">${product.title || 'Без названия'}</div>
              <div class="card-price">${priceVal} сум</div>
              <div class="card-meta">${product.category || 'Без категории'} • ${product.condition || '8/10'}</div>
            </div>
          </div>
        `;
        gridEl.innerHTML += cardHtml;
      });
    }

    /* ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК */
    function switchTab(tabName, element) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById('tab-' + tabName).classList.add('active');

      if (element) {
        element.classList.add('active');
      }

      if (tabName === 'favorites') renderFavorites();
      if (tabName === 'cart') renderCart();
    }

    /* ИЗБРАННОЕ И КОРЗИНА */
    function toggleFav(e, id) {
      if (e) e.stopPropagation();
      if (favorites.includes(id)) {
        favorites = favorites.filter(item => item !== id);
      } else {
        favorites.push(id);
      }
      renderProducts(loadedProducts);
      renderFavorites();
    }

    function renderFavorites() {
      const grid = document.getElementById('favorites-grid');
      const empty = document.getElementById('fav-empty');
      const favProducts = loadedProducts.filter(p => favorites.includes(p.id));

      grid.innerHTML = '';
      if (favProducts.length === 0) {
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        favProducts.forEach(product => {
          const originalIndex = loadedProducts.indexOf(product);
          let imageUrl = product.image_urls ? (Array.isArray(product.image_urls) ? product.image_urls[0] : product.image_urls).replace(/[\{\}\"\']/g, '') : '';
          grid.innerHTML += `
            <div class="card" onclick="openProduct(${originalIndex})">
              <img class="card-img" src="${imageUrl}">
              <div class="card-info">
                <div class="card-title">${product.title}</div>
                <div class="card-price">${Number(product.price).toLocaleString('ru-RU')} сум</div>
              </div>
            </div>
          `;
        });
      }
    }

    function toggleCartFromModal() {
      if (activeModalIndex === null) return;
      const p = loadedProducts[activeModalIndex];
      if (cart.includes(p.id)) {
        cart = cart.filter(id => id !== p.id);
      } else {
        cart.push(p.id);
      }
      updateCartBadge();
      closeProduct();
    }

    function updateCartBadge() {
      document.getElementById('cart-count').innerText = cart.length;
    }

    function renderCart() {
      const grid = document.getElementById('cart-grid');
      const empty = document.getElementById('cart-empty');
      const cartProducts = loadedProducts.filter(p => cart.includes(p.id));

      grid.innerHTML = '';
      if (cartProducts.length === 0) {
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        cartProducts.forEach(product => {
          const originalIndex = loadedProducts.indexOf(product);
          let imageUrl = product.image_urls ? (Array.isArray(product.image_urls) ? product.image_urls[0] : product.image_urls).replace(/[\{\}\"\']/g, '') : '';
          grid.innerHTML += `
            <div class="card" onclick="openProduct(${originalIndex})">
              <img class="card-img" src="${imageUrl}">
              <div class="card-info">
                <div class="card-title">${product.title}</div>
                <div class="card-price">${Number(product.price).toLocaleString('ru-RU')} сум</div>
              </div>
            </div>
          `;
        });
      }
    }

    function filterCategory(category, element) {
      const chips = document.querySelectorAll('.cat-chip');
      chips.forEach(chip => chip.classList.remove('active'));
      if (element) element.classList.add('active');

      const catLower = category.toLowerCase();
      if (catLower === 'все') {
        renderProducts(loadedProducts);
      } else {
        const filtered = loadedProducts.filter(p => p.category && p.category.toLowerCase().includes(catLower));
        renderProducts(filtered);
      }
    }

    function scrollToCatalog() {
      document.getElementById('catalog-section').scrollIntoView({ behavior: 'smooth' });
    }

    function openProduct(index) {
      activeModalIndex = index;
      const p = loadedProducts[index];
      if (!p) return;

      let imageUrl = p.image_urls ? (Array.isArray(p.image_urls) ? p.image_urls[0] : p.image_urls).replace(/[\{\}\"\']/g, '') : '';

      document.getElementById('m-img').src = imageUrl;
      document.getElementById('m-title').innerText = p.title || 'Без названия';
      document.getElementById('m-price').innerText = Number(p.price || 0).toLocaleString('ru-RU') + ' сум';
      document.getElementById('m-category').innerText = p.category || 'Категория';
      document.getElementById('m-condition').innerText = 'Состояние: ' + (p.condition || '8/10');
      document.getElementById('m-desc').innerText = p.description || 'Описание отсутствует.';
      
      document.getElementById('m-buy-btn').href = 'https://t.me/' + (p.seller_username || 'твой_username');
      
      const cartBtn = document.getElementById('m-cart-btn');
      cartBtn.innerText = cart.includes(p.id) ? '✓ В корзине' : '🛒 В корзину';

      document.getElementById('product-modal').style.display = 'block';
      tg.BackButton.show();
      tg.BackButton.onClick(closeProduct);
    }

    function closeProduct() {
      document.getElementById('product-modal').style.display = 'none';
      tg.BackButton.hide();
      activeModalIndex = null;
    }

    window.addEventListener('DOMContentLoaded', initAndLoad);
  </script>
</body>
</html>
