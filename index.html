<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Catalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1a1a1e;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
        }

        .cart-btn {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #27272a;
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 6px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-details {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .card-price {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            margin-top: auto;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            align-items: flex-end;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        .badges {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .badge {
            background: #27272a;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }

        .btn-primary:active {
            background: var(--accent-hover);
        }

        /* Cart modal list */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .remove-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Каталог</h1>
        <button class="cart-btn" onclick="openCart()">
            🛒 Корзина
            <span class="cart-badge" id="cartCount">0</span>
        </button>
    </header>

    <div class="grid" id="productsGrid">
        <!-- Товары загружаются из Supabase -->
    </div>

    <!-- Модальное окно товара -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('productModal')">&times;</button>
            <img id="modalImg" class="card-img" style="height: 250px; border-radius: 12px;" src="" alt="">
            <h2 id="modalTitle" style="margin: 16px 0 8px 0;"></h2>
            <div class="badges">
                <span class="badge" id="modalCategory"></span>
                <span class="badge" id="modalCondition"></span>
                <span class="badge" id="modalSize"></span>
            </div>
            <p id="modalDescription" style="color: var(--text-muted); line-height: 1.5;"></p>
            <div id="modalPrice" class="card-price" style="font-size: 20px; margin-bottom: 16px;"></div>
            <button class="btn-primary" id="addToCartBtn">Добавить в корзину</button>
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('cartModal')">&times;</button>
            <h2>Корзина</h2>
            <div id="cartItemsList"></div>
            <div style="display: flex; justify-content: space-between; margin-top: 20px; font-weight: 700; font-size: 18px;">
                <span>Итого:</span>
                <span id="cartTotalSum">0 сум</span>
            </div>
            <button class="btn-primary" onclick="checkout()">Оформить заказ в Telegram</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ВАШ_SUPABASE_URL.supabase.co';
        const SUPABASE_KEY = 'ВАШ_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_USERNAME = 'KYJITYPA'; // Ваш Telegram Юзернейм без @

        let products = [];
        let cart = [];
        let selectedProduct = null;

        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*');
            if (error) {
                console.error('Ошибка загрузки данных:', error);
                return;
            }
            products = data;
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            products.forEach(product => {
                const imgUrl = (product.image_urls && product.image_urls.length > 0) 
                    ? product.image_urls[0] 
                    : 'https://via.placeholder.com/300';

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openProductModal(product);

                card.innerHTML = `
                    <img class="card-img" src="${imgUrl}" alt="${product.title}">
                    <div class="card-body">
                        <h3 class="card-title">${product.title}</h3>
                        <div class="card-details">
                            ${product.category || ''} ${product.size ? '• Размер: ' + product.size : ''}
                        </div>
                        <div class="card-price">${Number(product.price).toLocaleString()} сум</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openProductModal(product) {
            selectedProduct = product;
            const imgUrl = (product.image_urls && product.image_urls.length > 0) 
                ? product.image_urls[0] 
                : 'https://via.placeholder.com/300';

            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('modalTitle').innerText = product.title;
            document.getElementById('modalCategory').innerText = `Категория: ${product.category || 'Не указана'}`;
            document.getElementById('modalCondition').innerText = `Состояние: ${product.condition || 'Не указано'}`;
            document.getElementById('modalSize').innerText = `Размер: ${product.size || 'Не указан'}`;
            document.getElementById('modalDescription').innerText = product.description || 'Описание отсутствует';
            document.getElementById('modalPrice').innerText = `${Number(product.price).toLocaleString()} сум`;

            document.getElementById('addToCartBtn').onclick = () => {
                cart.push(product);
                updateCartCount();
                closeModal('productModal');
            };

            document.getElementById('productModal').classList.add('active');
        }

        function openCart() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';

            if (cart.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Корзина пуста</p>';
            } else {
                cart.forEach((item, index) => {
                    const row = document.createElement('div');
                    row.className = 'cart-item';
                    row.innerHTML = `
                        <div>
                            <div style="font-weight: 600;">${item.title}</div>
                            <div style="font-size: 12px; color: var(--text-muted);">
                                ${item.size ? 'Размер: ' + item.size + ' | ' : ''}${Number(item.price).toLocaleString()} сум
                            </div>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${index})">Удалить</button>
                    `;
                    list.appendChild(row);
                });
            }

            const total = cart.reduce((sum, item) => sum + Number(item.price), 0);
            document.getElementById('cartTotalSum').innerText = `${total.toLocaleString()} сум`;

            document.getElementById('cartModal').classList.add('active');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartCount();
            openCart();
        }

        function updateCartCount() {
            document.getElementById('cartCount').innerText = cart.length;
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Добавьте хотя бы один товар в корзину');
                return;
            }

            let text = "Здравствуйте! Хочу оформить заказ:\n\n";
            let total = 0;

            cart.forEach((item, i) => {
                text += `${i + 1}. ${item.title}`;
                if (item.size) text += ` (Размер: ${item.size})`;
                text += ` — ${Number(item.price).toLocaleString()} сум\n`;
                total += Number(item.price);
            });

            text += `\nИтого к оплате: ${total.toLocaleString()} сум`;

            // Кодируем текст для передачи через URL
            const encodedText = encodeURIComponent(text);
            const telegramUrl = `https://t.me/${ADMIN_USERNAME}?text=${encodedText}`;

            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(telegramUrl);
            } else {
                window.open(telegramUrl, '_blank');
            }
        }

        fetchProducts();
    </script>
</body>
</html>
